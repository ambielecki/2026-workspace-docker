services:
  workspace-nginx-proxy:
    container_name: workspace-nginx-proxy
    build: ./builds/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs

  workspace-mariadb:
    image: mariadb:13.0.2
    container_name: workspace-mariadb
    ports:
      - "33060:3306"
    volumes:
      - ./db-data:/var/lib/mysql:delegated
      - ./dumps:/var/lib/mysql/dumps
    working_dir: /var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root

  workspace-php85:
    container_name: workspace-php85
    build: ./builds/php85
    volumes:
      - ../code/:/var/www/html/
    working_dir: /var/www/html
    links:
      - workspace-mariadb

  workspace-php85-deploy:
    container_name: workspace-php85-deploy
    build: ./builds/php85-deploy
    volumes:
      - ../code/:/var/www/html/
    working_dir: /var/www/html
    links:
      - workspace-mariadb